name: daily

# Load the last 10 days (whole months are replaced), rebuild and test the dbt models, publish the site.
on:
  schedule:
    - cron: "47 2 * * *"   # 02:47 UTC = 08:17 IST, after yesterday's UTC hours are available; off the busy :00/:30 slots
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # the Pipeline tab lists this workflow's recent runs

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/secrets/gcp-key.json
  DBT_PROJECT_DIR: dbt
  DBT_PROFILES_DIR: dbt

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write service-account key
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Load last 10 days
        run: python -m loader.main --days 10

      - name: Source freshness
        run: dbt source freshness

      - name: dbt build (models + tests)
        run: dbt build

      - name: Keep dbt results
        if: always()
        run: cp dbt/target/run_results.json reports/dbt_build_results.json || true

      - name: dbt docs
        run: dbt docs generate --static

      - name: Assemble site (dashboard + data + dbt docs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/dbt
          cp -r docs/. site/
          # stamp asset URLs with the commit so browsers never mix a new page with cached old CSS/JS
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html
          python scripts/export_dashboard.py --out site/data/dashboard.json
          cp dbt/target/static_index.html site/dbt/index.html

      - name: Run summary
        if: always()
        run: python scripts/run_summary.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: reports/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Remove key
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  deploy:
    needs: pipeline
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
