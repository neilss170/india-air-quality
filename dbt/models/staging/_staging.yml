version: 2

models:
  - name: stg_air_quality_hourly
    description: >
      Hourly pollutant concentrations per city, from 2022-08-04 00:00 UTC (the start of the CAMS history).
      Modelled grid values, not ground-station readings. IST is UTC+05:30 (no daylight saving).
    columns:
      - name: city
        data_tests: [not_null]
      - name: measured_at_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: measured_at_ist
        description: Start of the hour in India Standard Time (DATETIME, no zone).
        data_tests: [not_null]
      - name: date_ist
        description: Calendar date in IST, the grain used for daily AQI.
      - name: hour_ist
        description: 0-23, IST.
      - name: pm25_ugm3
        description: PM2.5, µg/m³.
        data_tests: [not_null]
      - name: pm10_ugm3
        description: PM10, µg/m³.
        data_tests: [not_null]
      - name: no2_ugm3
        description: Nitrogen dioxide, µg/m³.
      - name: o3_ugm3
        description: Ozone, µg/m³.
      - name: co_ugm3
        description: Carbon monoxide, µg/m³ (CPCB uses mg/m³; divide by 1000).
      - name: so2_ugm3
        description: Sulphur dioxide, µg/m³.
      - name: grid_latitude
        description: Model grid cell the API answered from.
      - name: grid_longitude
    data_tests:
      - unique_combination:
          arguments:
            columns: [city, measured_at_utc]

  - name: stg_weather_hourly
    description: Hourly weather per city (ERA5 reanalysis), same hours as stg_air_quality_hourly.
    columns:
      - name: city
        data_tests: [not_null]
      - name: measured_at_utc
        data_tests: [not_null]
      - name: temperature_c
        description: Air temperature at 2 m, °C.
      - name: relative_humidity_pct
        description: Relative humidity at 2 m, %.
      - name: precipitation_mm
        description: Precipitation in the hour, mm.
      - name: wind_speed_kmh
        description: Wind speed at 10 m, km/h.
      - name: wind_direction_deg
        description: Wind direction at 10 m, degrees (meteorological, direction wind comes from).
    data_tests:
      - unique_combination:
          arguments:
            columns: [city, measured_at_utc]
