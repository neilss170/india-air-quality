version: 2

sources:
  - name: raw
    description: Hourly Open-Meteo data written by `loader/` (one partition per month, replaced whole on each load).
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: raw
    config:
      # loaded_at is stamped by every load, and the daily run always rewrites the current month,
      # so max(loaded_at) is the time of the last successful run. The cron runs once a day.
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 54, period: hour}
    tables:
      - name: air_quality_hourly
        description: CAMS global model (via Open-Meteo), µg/m³, one row per city per UTC hour.
        columns:
          - name: city
            data_tests: [not_null]
          - name: ts
            description: Start of the hour, UTC.
            data_tests: [not_null]
          - name: pm2_5
            description: Negative model values are kept here and floored at 0 in staging.
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
          - name: pm10
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
          - name: nitrogen_dioxide
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
          - name: ozone
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
          - name: carbon_monoxide
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
          - name: sulphur_dioxide
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                  config:
                    severity: warn
        data_tests:
          - unique_combination:
              arguments:
                columns: [city, ts]
      - name: weather_hourly
        description: ERA5 reanalysis (via Open-Meteo Historical Weather), one row per city per UTC hour.
        columns:
          - name: city
            data_tests: [not_null]
          - name: ts
            data_tests: [not_null]
        data_tests:
          - unique_combination:
              arguments:
                columns: [city, ts]
      - name: station_pm_daily
        description: >
          Daily PM2.5 and PM10 means from ground stations (OpenAQ v3, mostly CPCB), one row per city, sensor and
          local (IST) day; written by `loader/stations.py` for the 6 nearest reference monitors of each city.
        config:
          # loaded weekly, not daily
          freshness:
            warn_after: {count: 9, period: day}
            error_after: {count: 30, period: day}
        columns:
          - name: city
            data_tests: [not_null]
          - name: sensor_id
            data_tests: [not_null]
          - name: date_local
            data_tests: [not_null]
          - name: parameter
            data_tests:
              - accepted_values:
                  arguments:
                    values: [pm25, pm10]
        data_tests:
          - unique_combination:
              arguments:
                columns: [city, sensor_id, date_local]
